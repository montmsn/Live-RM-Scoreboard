<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Real Madrid Live Scoreboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,200..800&family=Unbounded:wght@400..800&display=swap">
<!--
  Live scoreboard overlay for OBS / Streamlabs (Browser Source, 1920x1080).
  Data: ESPN public scoreboard JSON (free, no key). Polls every 15s while the match is live.

  URL options (add after the file path, e.g. overlay.html?demo=1):
    demo=1        play a scripted demo match instead of live data
    team=86       ESPN team id to follow (86 = Real Madrid)
    scale=1       make everything bigger/smaller (e.g. 0.8 or 1.2)
    pos=top       top | bottom
    debug=1       show a small status line with what the overlay is doing
-->
<style>
:root{
  --h1:#f0c75e; --h2:#7b5cff; --a1:#2563eb; --a2:#c0174f;
  --red:#ff3b4e;
  --f-ui:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --f-score:"Unbounded","Arial Black",sans-serif;
  --spring:cubic-bezier(.34,1.32,.5,1);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%;background:transparent;overflow:hidden;-webkit-text-size-adjust:100%}
body.pos-bottom .island{top:auto;bottom:3.6%}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:4}
#debug{position:fixed;left:8px;bottom:8px;font:12px/1.4 ui-monospace,monospace;color:#fff;background:rgba(0,0,0,.6);padding:6px 8px;border-radius:6px;max-width:60vw;white-space:pre-wrap;z-index:9}
.island.hidden{opacity:0;transform:scale(.6);transition:opacity .4s,transform .4s}
.vs{display:none;font-family:var(--f-score);font-weight:700;font-size:.62em;letter-spacing:.08em;color:rgba(255,255,255,.85);padding:0 .3em}
.score.pre .num,.score.pre .colon{display:none}
.score.pre .vs{display:block}
.island.pre .live{display:none}
.p-event .ic.yellow{background:#ffd23f;box-shadow:0 0 .8em #ffd23f}
/* ===== island ===== */
/* the island has no fixed size: it is always exactly as big as the panel inside it, so text can never stick out */
.island{position:absolute;top:3.6%;left:0;right:0;margin-inline:auto;width:max-content;max-width:96%;z-index:3;font-size:13px;font-family:var(--f-ui);color:#fff;
  display:grid;min-width:3.9em;min-height:3.9em;border-radius:1.95em;transition:border-radius .6s var(--spring)}
.island.boot{width:3.9em;height:3.9em}
.island.goal{border-radius:2.8em}
.island.info{border-radius:2.6em}

.glass{position:absolute;inset:0;border-radius:inherit;overflow:hidden;
  background:linear-gradient(180deg,rgba(255,255,255,.16),rgba(255,255,255,.03) 55%),rgba(12,14,24,.42);
  -webkit-backdrop-filter:blur(1.4em) saturate(1.9) brightness(.9);backdrop-filter:blur(1.4em) saturate(1.9) brightness(.9);
  box-shadow:inset 0 .07em 0 rgba(255,255,255,.55),inset 0 -.06em 0 rgba(255,255,255,.12),inset 0 0 0 .06em rgba(255,255,255,.12),0 1em 3em rgba(0,0,0,.45);}
/* aurora: team colours glowing through the glass */
.orb{position:absolute;width:12em;height:12em;border-radius:50%;filter:blur(2.2em);opacity:.55;transition:opacity .8s ease,transform 1.2s var(--spring)}
.orb.h1{left:-4em;top:-6em;background:var(--h1);animation:drift 9s ease-in-out infinite alternate}
.orb.h2{left:3em;top:-2em;width:8em;height:8em;background:var(--h2);opacity:.35;animation:drift 11s ease-in-out infinite alternate-reverse}
.orb.a1{right:-4em;top:-6em;background:var(--a1);animation:drift 10s ease-in-out infinite alternate-reverse}
.orb.a2{right:3em;top:-1em;width:8em;height:8em;background:var(--a2);opacity:.4;animation:drift 12s ease-in-out infinite alternate}
@keyframes drift{to{translate:2em 1.5em;scale:1.15}}
.island.goal-h .orb.h1,.island.goal-h .orb.h2{opacity:.95;transform:translateX(12em) scale(2.2)}
.island.goal-h .orb.a1,.island.goal-h .orb.a2{opacity:0}
.island.goal-a .orb.a1,.island.goal-a .orb.a2{opacity:.95;transform:translateX(-12em) scale(2.2)}
.island.goal-a .orb.h1,.island.goal-a .orb.h2{opacity:0}
/* specular sheen that drifts across */
.glass::after{content:"";position:absolute;inset:-50% -20%;background:linear-gradient(115deg,transparent 42%,rgba(255,255,255,.18) 50%,transparent 58%);transform:translateX(-60%);animation:sheen 8s ease-in-out 2.5s infinite}
@keyframes sheen{0%,15%{transform:translateX(-60%)}35%,100%{transform:translateX(60%)}}

/* panels crossfade with blur */
.panel{position:relative;z-index:1;grid-area:1/1;white-space:nowrap;display:none;align-items:center;opacity:0;filter:blur(.4em);transform:scale(.97);
  transition:opacity .14s ease,filter .14s ease,transform .14s ease;pointer-events:none}
.panel.on{display:flex}
.panel:not(.on){display:none!important}
.p-info.on{display:grid}
.panel.show{opacity:1;filter:none;transform:none;transition:opacity .3s ease,filter .3s ease,transform .5s var(--spring)}
.p-compact,.p-event{min-height:3.9em}
.p-event{min-width:22em}
.p-goal{min-height:9.2em}
.p-info{min-width:30em;min-height:8.6em}

/* compact */
.p-compact{padding:0 .5em 0 .55em;gap:0}
.p-compact>div{display:flex;align-items:center;height:100%;flex:none}
.side{gap:.55em;padding:0 .9em}
.side.home{padding-left:.35em}
.p-compact>div+div{position:relative}
.p-compact>div+div::before{content:"";position:absolute;left:0;top:28%;bottom:28%;width:1px;background:linear-gradient(transparent,rgba(255,255,255,.28),transparent)}
.logo{display:block;height:2.75em;width:auto;flex:none;filter:drop-shadow(0 .15em .35em rgba(0,0,0,.45))}
.logo.big{height:6.4em;filter:drop-shadow(0 .3em .8em rgba(0,0,0,.5))}
.island.goal .logo.big{animation:logoIn .8s var(--spring) .1s both}
@keyframes logoIn{from{opacity:0;transform:scale(.4) rotate(-12deg)}}
.logo.sm{height:2.1em}
.code{font-size:1.2em;font-weight:700;letter-spacing:.04em;font-variation-settings:"opsz" 24}
.reds{display:flex;gap:.15em}
.reds i{width:.42em;height:.62em;border-radius:.1em;background:var(--red);box-shadow:0 0 .5em var(--red);animation:pop .5s var(--spring) both}
@keyframes pop{from{transform:scale(0)}}
.p-compact .score-cell{padding:0 .35em}
.p-compact .score-cell::before{display:none}
.p-compact .score-cell+div::before{display:none}
.score{display:flex;align-items:center;justify-content:center;gap:.3em;height:1.75em;padding:0 .55em;border-radius:.9em;background:rgba(255,255,255,.1);box-shadow:inset 0 0 0 1px rgba(255,255,255,.14);font-family:var(--f-score);font-weight:700;font-size:1.45em;font-variant-numeric:tabular-nums}
.num{position:relative;display:inline-grid;min-width:.9em;height:1.2em;justify-items:center;overflow:visible}
.num span{grid-area:1/1;line-height:1.2em}
.num span.out{animation:numOut .5s ease forwards}
.num span.in{animation:numIn .7s var(--spring) both}
@keyframes numOut{to{opacity:0;filter:blur(.25em);transform:translateY(-.6em) scale(.8)}}
@keyframes numIn{from{opacity:0;filter:blur(.25em);transform:translateY(.6em) scale(1.3)}}
.colon{display:grid;gap:.18em}.colon i{width:.17em;height:.17em;border-radius:50%;background:rgba(255,255,255,.6)}
.p-compact .time{gap:.45em;padding:0 .7em 0 .9em}
.time b{font-size:1.15em;font-weight:700;font-variant-numeric:tabular-nums;min-width:2.1em}
.live{width:.5em;height:.5em;border-radius:50%;background:var(--red);box-shadow:0 0 0 0 rgba(255,59,78,.7);animation:ring 1.6s infinite}
.island.paused .live{background:rgba(255,255,255,.5);animation:none}
@keyframes ring{70%{box-shadow:0 0 0 .5em rgba(255,59,78,0)}100%{box-shadow:0 0 0 0 rgba(255,59,78,0)}}
.plus{display:none;font-size:.78em;font-weight:700;color:#fff;background:rgba(255,59,78,.9);border-radius:.6em;padding:.05em .45em}
.plus.on{display:inline-block;animation:pop .5s var(--spring) both}

/* match progress line with goal markers */
.track{position:absolute;z-index:1;left:2.2em;right:2.2em;bottom:.32em;height:.1em;border-radius:1em;background:rgba(255,255,255,.12);transition:opacity .3s}
.track .fill{position:absolute;inset:0 auto 0 0;border-radius:inherit;background:linear-gradient(90deg,rgba(255,255,255,.2),#fff);box-shadow:0 0 .5em rgba(255,255,255,.6)}
.track .mk{position:absolute;top:50%;width:.36em;height:.36em;border-radius:50%;transform:translate(-50%,-50%);box-shadow:0 0 .4em currentColor}
.track .mk.h{background:var(--h1);color:var(--h1)}.track .mk.a{background:var(--a1);color:var(--a1)}
.island:not(.compact) .track{opacity:0}

/* goal panel */
.p-goal{padding:0 2.4em 0 1.8em;gap:1.4em}
.kinetic{font-family:var(--f-ui);font-size:4.6em;line-height:.9;letter-spacing:0;gap:.02em;font-variation-settings:"opsz" 96;display:flex}
.kinetic span{display:inline-block;font-weight:800;background:linear-gradient(180deg,#fff 30%,var(--k2,#f0c75e));-webkit-background-clip:text;background-clip:text;color:transparent}
.island.goal .kinetic span{animation:kin .9s var(--spring) both}
@keyframes kin{0%{opacity:0;transform:translateY(.4em) scale(.6);font-weight:200;filter:blur(.1em)}60%{font-weight:800}100%{opacity:1;transform:none}}
.goalinfo{display:grid;gap:.3em;min-width:0;padding-left:1.4em;border-left:1px solid rgba(255,255,255,.25)}
.goalinfo .tm{font-size:.85em;font-weight:600;letter-spacing:.24em;color:rgba(255,255,255,.7)}
.goalinfo .nm{font-size:1.75em;font-weight:800;letter-spacing:-.01em;white-space:nowrap}
.goalinfo .ln{display:flex;align-items:center;gap:.6em;font-size:1em;color:rgba(255,255,255,.85)}
.goalinfo .ln .sc{font-family:var(--f-score);font-weight:700}
.chip{font-size:.8em;font-weight:700;padding:.15em .6em;border-radius:1em;background:rgba(255,255,255,.15);box-shadow:inset 0 0 0 1px rgba(255,255,255,.2)}

/* info panel: scorers */
.p-info{padding:.9em 1.8em 1.1em;display:grid;grid-template-columns:minmax(9em,1fr) auto minmax(9em,1fr);gap:.6em 0;align-items:stretch}
.p-info .hd{grid-column:1/-1;display:flex;justify-content:center;gap:.6em;padding-bottom:.55em;border-bottom:1px solid rgba(255,255,255,.14);font-size:.82em;letter-spacing:.24em;color:rgba(255,255,255,.65);font-weight:600}
.p-info ul{padding:0 1.3em 0 0 !important}
.p-info ul.r{padding:0 0 0 1.3em !important}
.p-info .mid{padding:0 1.3em;border-left:1px solid rgba(255,255,255,.14);border-right:1px solid rgba(255,255,255,.14)}
.p-info ul{list-style:none;margin:0;padding:0;display:grid;gap:.25em;font-size:1em}
.p-info ul.r{text-align:right}
.p-info li b{font-weight:700}.p-info li span{color:rgba(255,255,255,.6);font-variant-numeric:tabular-nums}
.p-info .mid{display:flex;align-items:center;gap:.5em;align-self:center}
.p-info .mid b{font-family:var(--f-score);font-weight:700;font-size:1.9em}

/* event panel (red card, HT, FT, added time) */
.p-event{justify-content:center;gap:.8em;padding:0 1.8em;font-size:1.05em;font-weight:700;letter-spacing:.02em}
.p-event .ic{width:.8em;height:1.1em;border-radius:.15em;background:var(--red);box-shadow:0 0 .8em var(--red)}
.p-event .ic.whistle{width:.9em;height:.9em;border-radius:50%;background:#fff;box-shadow:0 0 .8em #fff}
.p-event small{font-weight:500;color:rgba(255,255,255,.65)}


</style>
</head>
<body>
<div class="island boot" id="island">
  <div class="glass"><i class="orb h1"></i><i class="orb h2"></i><i class="orb a1"></i><i class="orb a2"></i></div>

  <div class="panel p-compact" id="pCompact">
    <div class="side home"><img class="logo" data-side="h" alt=""><span class="code" id="codeH">RMA</span><span class="reds" id="redsH"></span></div>
    <div class="score-cell"><div class="score" id="scoreBox"><span class="num" id="nH"><span>0</span></span><span class="colon"><i></i><i></i></span><span class="num" id="nA"><span>0</span></span><span class="vs">VS</span></div></div>
    <div class="side away"><span class="reds" id="redsA"></span><span class="code" id="codeA">OPP</span><img class="logo" data-side="a" alt=""></div>
    <div class="time"><span class="live"></span><b id="clock">–</b></div>
  </div>

  <div class="panel p-goal" id="pGoal">
    <img class="logo big" id="gLogo" alt="">
    <div class="kinetic" id="kinetic"></div>
    <div class="goalinfo">
      <span class="tm" id="gTeam"></span>
      <span class="nm" id="gName"></span>
      <span class="ln"><span class="chip" id="gMin"></span><span class="sc" id="gScore"></span></span>
    </div>
  </div>

  <div class="panel p-info" id="pInfo">
    <div class="hd" id="infoHd"></div>
    <ul id="listH"></ul>
    <div class="mid"><img class="logo sm" data-side="h" alt=""><b id="infoScore"></b><img class="logo sm" data-side="a" alt=""></div>
    <ul class="r" id="listA"></ul>
  </div>

  <div class="panel p-event" id="pEvent"><img class="logo sm" id="evLogo" alt="" hidden><span class="ic" id="evIc"></span><span id="evText"></span></div>

  <div class="track" id="track"><div class="fill" id="fill"></div></div>
</div>
<canvas id="fx"></canvas>
<div id="debug" hidden></div>

const TEAM_COLORS={"86":["#f0c75e","#7b5cff"],"83":["#2563eb","#c0174f"]}; /* Real Madrid, Barcelona */

const $=id=>document.getElementById(id);
const island=$("island");
const panels={compact:$("pCompact"),goal:$("pGoal"),info:$("pInfo"),event:$("pEvent")};
const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
const dbg=$("debug");dbg.hidden=!DEBUG;
function log(msg){if(typeof note==="function")note(msg);}

/* ---------- size: 1.25% of the screen width per em (24px on a 1920 canvas) ---------- */
function scale(){island.style.fontSize=(innerWidth*1.25/100*SCALE)+"px";}
scale();addEventListener("resize",scale);

/* ---------- queue so animations never overlap ---------- */
let queue=Promise.resolve(),timers=[];
const wait=ms=>new Promise(r=>timers.push(setTimeout(r,ms)));
const enqueue=fn=>{queue=queue.then(fn).catch(e=>log("anim error "+e.message));};

/* ---------- island morph (size always comes from the content) ---------- */
let cur="boot",morph=null,swapT=0,showT=0,shownState="pre";
function mode(m,extra){
  cur=m;
  const next=panels[m==="wide"?"event":m];
  const prev=Object.values(panels).find(p=>p.classList.contains("on"));
  const cls="island "+m+(extra?" "+extra:"")+(shownState==="ht"||shownState==="post"?" paused":"")+(shownState==="pre"?" pre":"");
  clearTimeout(swapT);clearTimeout(showT);
  if(prev===next){island.className=cls;next.classList.add("show");return;}
  if(prev)prev.classList.remove("show");
  const swap=()=>{
    const w0=island.offsetWidth,h0=island.offsetHeight;
    if(morph)morph.cancel();
    Object.values(panels).forEach(p=>{if(p!==next)p.classList.remove("on","show");});
    island.className=cls;next.classList.add("on");
    const w1=island.offsetWidth,h1=island.offsetHeight;
    if(island.animate&&!reduce){morph=island.animate([{width:w0+"px",height:h0+"px"},{width:w1+"px",height:h1+"px"}],{duration:700,easing:"cubic-bezier(.34,1.32,.5,1)"});morph.onfinish=()=>{morph=null;};}
    showT=setTimeout(()=>next.classList.add("show"),reduce?0:400);
  };
  if(prev)swapT=setTimeout(swap,150);else swap();
}
function refreshClass(){ if(cur!=="boot") mode(cur); }

/* ---------- small renderers ---------- */
function setNum(id,v,instant){
  const box=$(id);v=String(v);
  const curEl=box.querySelector("span:not(.out)");
  if(curEl&&curEl.textContent===v)return;
  if(instant||!curEl){box.innerHTML="<span>"+v+"</span>";return;}
  box.querySelectorAll("span.out").forEach(o=>o.remove());
  curEl.className="out";setTimeout(()=>curEl.remove(),550);
  const n=document.createElement("span");n.className="in";n.textContent=v;box.appendChild(n);
}
function loadLogo(img,src,fallback){
  img.hidden=false;img.onerror=()=>{if(fallback&&img.src!==fallback)img.src=fallback;else img.hidden=true;};img.src=src||fallback||"";
}
function setLogos(side,src,fallback){document.querySelectorAll('[data-side="'+side+'"]').forEach(img=>loadLogo(img,src,fallback));}
function setReds(side,n){
  const box=$(side==="h"?"redsH":"redsA");
  while(box.children.length<n)box.appendChild(document.createElement("i"));
  while(box.children.length>n)box.lastChild.remove();
}
function renderTrack(m){
  const min=m&&m.minute||0;
  $("fill").style.width=Math.min(100,min/90*100)+"%";
  const tr=$("track");tr.querySelectorAll(".mk").forEach(x=>x.remove());
  shown.goals.forEach(g=>{const k=document.createElement("i");k.className="mk "+g.side;k.style.left=Math.min(100,(g.minute||0)/90*100)+"%";tr.appendChild(k);});
}
const DAYS=["SUN","MON","TUE","WED","THU","FRI","SAT"];
function kickoffText(d){
  const now=new Date(),hm=String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0");
  const sameDay=d.toDateString()===now.toDateString();
  if(sameDay)return "TODAY "+hm;
  const days=(d-now)/864e5;
  if(days<6)return DAYS[d.getDay()]+" "+hm;
  return d.getDate()+"/"+(d.getMonth()+1)+" "+hm;
}

/* ---------- confetti ---------- */
const cv=$("fx"),cx=cv.getContext("2d");let parts=[],raf=0;
function burst(colors){
  if(reduce)return;
  const dpr=devicePixelRatio||1;cv.width=innerWidth*dpr;cv.height=innerHeight*dpr;
  const ir=island.getBoundingClientRect(),ox=(ir.left+ir.width/2)*dpr,oy=(ir.top+ir.height*.7)*dpr,s=innerWidth/1000*dpr;
  for(let i=0;i<140;i++){const a=Math.PI*(.1+.8*Math.random()),v=(4+Math.random()*9)*s;
    parts.push({x:ox+(Math.random()-.5)*ir.width*dpr*.8,y:oy,vx:Math.cos(a)*v*(Math.random()<.5?-1:1),vy:Math.sin(a)*v*.6,w:(4+Math.random()*5)*s,h:(7+Math.random()*7)*s,r:Math.random()*6,vr:(Math.random()-.5)*.3,c:colors[i%colors.length],life:1});}
  if(!raf)raf=requestAnimationFrame(tick);
}
function tick(){
  cx.clearRect(0,0,cv.width,cv.height);
  parts.forEach(p=>{p.vy+=.18*(cv.width/1000);p.vx*=.99;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;p.life-=.006;
    cx.save();cx.globalAlpha=Math.max(0,p.life);cx.translate(p.x,p.y);cx.rotate(p.r);cx.fillStyle=p.c;cx.fillRect(-p.w/2,-p.h/2,p.w,p.h*Math.abs(Math.cos(p.r*2)));cx.restore();});
  parts=parts.filter(p=>p.life>0&&p.y<cv.height+40);
  raf=parts.length?requestAnimationFrame(tick):0;
}

/* ================= state shown on screen ================= */
let match=null;          /* latest model from the feed */
let shown={id:null,h:0,a:0,goals:[],reds:{h:0,a:0},seen:new Set(),state:null};

function applyTeams(m){
  const cols=t=>TEAM_COLORS[t.id]||[t.color||"#ffffff",t.alt||t.color||"#9aa3b5"];
  const hc=cols(m.home),ac=cols(m.away),r=document.documentElement.style;
  r.setProperty("--h1",hc[0]);r.setProperty("--h2",hc[1]);r.setProperty("--a1",ac[0]);r.setProperty("--a2",ac[1]);
  $("codeH").textContent=m.home.code;$("codeA").textContent=m.away.code;
  setLogos("h",m.home.logo,FALLBACK_LOGO[m.home.id]);
  setLogos("a",m.away.logo,FALLBACK_LOGO[m.away.id]);
}
function logoOf(side){return side==="h"?match.home.logo:match.away.logo;}
function putLogo(img,side){const t=teamOf(side);loadLogo(img,t.logo,FALLBACK_LOGO[t.id]);}
function teamOf(side){return side==="h"?match.home:match.away;}

function renderClock(m){
  const pre=m.state==="pre";
  $("scoreBox").classList.toggle("pre",pre);
  $("clock").textContent=pre?kickoffText(m.kickoff):m.state==="ht"?"HT":m.state==="post"?(m.clock||"FT"):(m.clock||"");
}

/* first time we see a match: show it as it is, no animations */
function hardSet(m){
  shown={id:m.id,h:m.home.score,a:m.away.score,goals:m.events.filter(e=>e.type==="goal"),reds:{h:0,a:0},seen:new Set(m.events.map(e=>e.key)),state:m.state,dec:Math.floor((m.minute||0)/10)};
  m.events.forEach(e=>{if(e.type==="red")shown.reds[e.side]++;});
  applyTeams(m);
  setNum("nH",m.home.score,true);setNum("nA",m.away.score,true);
  setReds("h",shown.reds.h);setReds("a",shown.reds.a);
  shownState=m.state;renderClock(m);renderTrack(m);
  enqueue(async()=>{await wait(300);mode("compact");await wait(850);});
}

/* every later update: animate what changed */
function update(m){
  renderClock(m);renderTrack(m);
  /* scorer list opens once at every 10th minute: 10', 20', 30' ... 90' */
  const dec=Math.floor((m.minute||0)/10);
  const tenth=m.state==="in"&&m.minute>=10&&dec>shown.dec;
  if(m.state==="in")shown.dec=Math.max(shown.dec,dec);
  const fresh=m.events.filter(e=>!shown.seen.has(e.key));
  fresh.forEach(e=>shown.seen.add(e.key));
  /* status changes */
  if(m.state!==shown.state){
    const from=shown.state;shown.state=m.state;
    if(m.state==="ht")announce("HALF-TIME",scoreLine(m),"whistle",4200,()=>{shownState="ht";});
    else if(m.state==="post")announce("FULL-TIME",scoreLine(m),"whistle",5200,()=>{shownState="post";});
    else if(m.state==="in"&&from==="ht")announce("SECOND HALF","KICK-OFF","whistle",2800,()=>{shownState="in";});
    else if(m.state==="in"&&from==="pre")announce("KICK-OFF",m.home.name+" v "+m.away.name,"whistle",3200,()=>{shownState="in";});
    else shownState=m.state;
  }
  fresh.forEach(e=>{
    if(e.type==="goal")goalSeq(e,m);
    else if(e.type==="red")redSeq(e);
    else if(e.type==="yellow")yellowSeq(e);
  });
  if(tenth)showInfo();
  /* keep the score honest (VAR, feeds without goal details) */
  enqueue(async()=>{
    if(shown.h!==match.home.score||shown.a!==match.away.score){
      const hUp=match.home.score>shown.h,aUp=match.away.score>shown.a;
      if((hUp||aUp)&&!(hUp&&aUp)){await goalAnim({side:hUp?"h":"a",player:"",clockText:""},match.home.score,match.away.score);}
      shown.h=match.home.score;shown.a=match.away.score;
      setNum("nH",shown.h);setNum("nA",shown.a);
    }
  });
}
function scoreLine(m){return m.home.code+" "+m.home.score+" – "+m.away.score+" "+m.away.code;}

function announce(title,sub,ic,ms,after){
  enqueue(async()=>{
    if(after)after();
    $("evIc").className="ic"+(ic?" "+ic:"");$("evLogo").hidden=true;
    $("evText").innerHTML=title+(sub?" <small>· "+esc(sub)+"</small>":"");
    mode("wide");await wait(ms);mode("compact");await wait(850);
  });
}
function goalSeq(e){
  enqueue(async()=>{
    const nh=shown.h+(e.side==="h"?1:0),na=shown.a+(e.side==="a"?1:0);
    await goalAnim(e,nh,na);
    shown.h=nh;shown.a=na;shown.goals.push(e);
    setNum("nH",nh);setNum("nA",na);renderTrack(match);
    await wait(400);
  });
}
async function goalAnim(e,nh,na){
  const t=teamOf(e.side);
  $("kinetic").style.setProperty("--k2",e.side==="h"?"var(--h1)":"var(--a1)");
  $("kinetic").innerHTML=[..."GOAL"].map((c,i)=>'<span style="animation-delay:'+(.25+i*.08)+'s">'+c+'</span>').join("");
  putLogo($("gLogo"),e.side);
  $("gTeam").textContent=t.name.toUpperCase();
  $("gName").textContent=e.player||t.name;
  $("gMin").textContent=e.clockText||"";$("gMin").hidden=!e.clockText;
  $("gScore").textContent=nh+" – "+na;
  mode("goal","goal-"+e.side);
  await wait(350);
  const c=getComputedStyle(document.documentElement);
  burst(e.side==="h"?[c.getPropertyValue("--h1"),c.getPropertyValue("--h2"),"#ffffff"]:[c.getPropertyValue("--a1"),c.getPropertyValue("--a2"),"#ffffff"]);
  await wait(4800);
  mode("compact");await wait(850);
}
function redSeq(e){
  enqueue(async()=>{
    putLogo($("evLogo"),e.side);
    $("evIc").className="ic";
    $("evText").innerHTML="RED CARD <small>· "+esc(e.player||teamOf(e.side).name)+(e.clockText?" "+esc(e.clockText):"")+"</small>";
    mode("wide");await wait(3400);mode("compact");await wait(850);
    shown.reds[e.side]++;setReds(e.side,shown.reds[e.side]);
  });
}
function yellowSeq(e){
  enqueue(async()=>{
    putLogo($("evLogo"),e.side);
    $("evIc").className="ic yellow";
    $("evText").innerHTML="YELLOW CARD <small>· "+esc(e.player||teamOf(e.side).name)+(e.clockText?" "+esc(e.clockText):"")+"</small>";
    mode("wide");await wait(3000);mode("compact");await wait(850);
  });
}
function showInfo(){
  if(!match||match.state==="pre")return;
  enqueue(async()=>{
    const li=g=>"<li><b>"+esc(g.player||"Goal")+"</b> <span>"+esc(g.clockText||"")+"</span></li>";
    $("listH").innerHTML=shown.goals.filter(g=>g.side==="h").map(li).join("")||"<li><span>–</span></li>";
    $("listA").innerHTML=shown.goals.filter(g=>g.side==="a").map(li).join("")||"<li><span>–</span></li>";
    $("infoScore").textContent=shown.h+" – "+shown.a;
    $("infoHd").innerHTML="<span>"+esc((match.comp||"").toUpperCase())+"</span>"+(match.venue?"<span>·</span><span>"+esc(match.venue.toUpperCase())+"</span>":"");
    mode("info");await wait(6000);mode("compact");await wait(850);
  });
}

const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function ingest(m){
  if(!m){log("no match found");return;}
  match=m;
  if(shown.id!==m.id){timers.forEach(clearTimeout);timers=[];queue=Promise.resolve();hardSet(m);}
  else update(m);
  log(m.home.code+" "+m.home.score+"-"+m.away.score+" "+m.away.code+" | "+m.state+" "+(m.clock||"")+" | "+m.comp);
}

/* ================= ESPN feed ================= */
function num(x){if(x==null)return 0;if(typeof x==="object")x=x.value!=null?x.value:x.displayValue;const n=parseInt(x,10);return isNaN(n)?0:n;}
function minuteOf(txt){const m=String(txt||"").match(/(\d+)(?:'?\s*\+\s*(\d+))?/);return m?parseInt(m[1],10):0;}
function hex(c){return c&&/^[0-9a-f]{6}$/i.test(c)?"#"+c:null;}
function teamModel(c){
  const t=c.team||{};
  const logo=t.logo||(t.logos&&t.logos[0]&&t.logos[0].href)||("https://a.espncdn.com/i/teamlogos/soccer/500/"+t.id+".png");
  return {id:String(t.id),code:(t.abbreviation||t.shortDisplayName||"").toUpperCase().slice(0,4),name:t.shortDisplayName||t.displayName||t.name||"",logo,color:hex(t.color),alt:hex(t.alternateColor),score:num(c.score)};
}
function normalize(ev,leagueName){
  const comp=ev.competitions&&ev.competitions[0];if(!comp)return null;
  const cs=comp.competitors||[];
  const hc=cs.find(c=>c.homeAway==="home")||cs[0],ac=cs.find(c=>c.homeAway==="away")||cs[1];
  if(!hc||!ac)return null;
  const home=teamModel(hc),away=teamModel(ac);
  const st=comp.status||ev.status||{},type=st.type||{};
  let state=type.state||"pre";
  const name=String(type.name||"");
  if(state==="in"&&/HALFTIME|HALF_TIME/.test(name))state="ht";
  const clock=state==="post"?(type.shortDetail||"FT"):(st.displayClock||type.shortDetail||"");
  const events=[];
  (comp.details||[]).forEach(d=>{
    const tid=String(d.team&&d.team.id);
    const side=tid===home.id?"h":tid===away.id?"a":null;if(!side)return;
    const clockText=(d.clock&&d.clock.displayValue)||"";
    const ath=d.athletesInvolved&&d.athletesInvolved[0];
    const player=ath?(ath.displayName||ath.shortName||""):"";
    let type=null;
    if(d.scoringPlay)type="goal";else if(d.redCard)type="red";else if(d.yellowCard)type="yellow";
    if(!type)return;
    events.push({type,side,player:player+(d.ownGoal?" (OG)":d.penaltyKick?" (P)":""),clockText,minute:minuteOf(clockText),key:type+"|"+side+"|"+clockText+"|"+player});
  });
  return {id:String(ev.id),comp:leagueName||(ev.season&&ev.season.slug)||"",venue:comp.venue&&comp.venue.fullName||"",state,clock,minute:state==="post"?90:state==="ht"?45:minuteOf(st.displayClock),
    kickoff:new Date(ev.date),home,away,events};
}
async function getJSON(url){const r=await fetch(url,{cache:"no-store"});if(!r.ok)throw new Error(r.status+" "+url);return r.json();}
function ymd(d){return d.getFullYear()+String(d.getMonth()+1).padStart(2,"0")+String(d.getDate()).padStart(2,"0");}
const hasTeam=ev=>(ev.competitions&&ev.competitions[0]&&ev.competitions[0].competitors||[]).some(c=>String(c.team&&c.team.id)===TEAM);

/* ---- debug trail: every request and what it found ---- */
const trail=[];
function note(t){trail.push(new Date().toLocaleTimeString()+" "+t);while(trail.length>14)trail.shift();if(DEBUG)dbg.textContent=trail.join("\n");}
async function tryJSON(url){
  try{const j=await getJSON(url);return j;}catch(e){note("x "+url.replace(API,"")+" -> "+e.message.split(" ")[0]);return null;}
}
const ymdUTC=d=>d.getUTCFullYear()+String(d.getUTCMonth()+1).padStart(2,"0")+String(d.getUTCDate()).padStart(2,"0");
const leagueName=(j,lg)=>j&&j.leagues&&j.leagues[0]&&(j.leagues[0].name||j.leagues[0].abbreviation)||lg;

/* events of one league around today, from several scoreboard views */
async function boardEvents(lg){
  const now=new Date(),urls=[API+lg+"/scoreboard",API+lg+"/scoreboard?dates="+ymdUTC(now),API+lg+"/scoreboard?dates="+ymd(now)];
  const out=new Map();
  for(const j of await Promise.all([...new Set(urls)].map(tryJSON))){
    if(!j)continue;const ln=leagueName(j,lg);
    (j.events||[]).forEach(ev=>{if(hasTeam(ev))out.set(String(ev.id),{ev,lg,lname:ln});});
  }
  return [...out.values()];
}
/* one match straight from its summary page (has key events: goals, cards) */
async function viaSummary(lg,id){
  const j=await tryJSON(API+lg+"/summary?event="+id);
  const c=j&&j.header&&j.header.competitions&&j.header.competitions[0];
  if(!c){return null;}
  const details=(j.keyEvents||[]).map(k=>{
    const txt=String(k.type&&k.type.text||"");
    const p=k.participants&&k.participants[0]&&k.participants[0].athlete;
    return {scoringPlay:!!k.scoringPlay||/goal/i.test(txt)&&!/disallow|no goal/i.test(txt),redCard:/red card/i.test(txt),yellowCard:/yellow card/i.test(txt)&&!/red/i.test(txt),ownGoal:/own goal/i.test(txt),penaltyKick:/penalty/i.test(txt),
      clock:k.clock,team:k.team,athletesInvolved:p?[p]:[]};
  });
  const ev={id:j.header.id||id,date:c.date,competitions:[Object.assign({},c,{details:details.length?details:(c.details||[]),venue:c.venue||(j.gameInfo&&j.gameInfo.venue)})]};
  const m=normalize(ev,j.header.league&&j.header.league.name||lg);
  if(m)m.lg=lg;
  return m;
}
let locked=null; /* {lg,id} of the match we are following */

async function findMatch(){
  const now=Date.now();
  /* 1. already following a match: refresh just that one */
  if(locked&&now-locked.kick<5*36e5){
    const evs=await boardEvents(locked.lg);
    const hit=evs.find(e=>String(e.ev.id)===locked.id);
    let m=hit?Object.assign(normalize(hit.ev,hit.lname),{lg:locked.lg}):null;
    const s=await viaSummary(locked.lg,locked.id);
    if(s&&(!m||!m.events.length&&s.events.length||m.state==="pre"&&s.state!=="pre"))m=Object.assign(s,{comp:m&&m.comp||s.comp});
    if(m){note("follow "+m.home.code+"-"+m.away.code+" "+m.state+" "+m.clock+" ("+m.events.length+" events)");if(m.state!=="post"||now-m.kickoff<4*36e5)return m;}
  }
  /* 2. today's scoreboards in every competition */
  const found=(await Promise.all(LEAGUES.map(boardEvents))).flat();
  note("scoreboards: "+found.length+" match(es) with team "+TEAM);
  let ms=found.map(f=>Object.assign(normalize(f.ev,f.lname)||{},{lg:f.lg})).filter(m=>m.id);
  /* 3. team schedules: catches today's match even if the scoreboards miss it */
  const sched=[];
  await Promise.all(LEAGUES.slice(0,3).map(async lg=>{
    for(const q of ["?fixture=true",""]){
      const j=await tryJSON(API+lg+"/teams/"+TEAM+"/schedule"+q);if(!j)continue;
      const ln=j.season&&j.season.name||lg;
      (j.events||[]).forEach(ev=>sched.push({ev,lg,lname:ln,d:new Date(ev.date)}));
    }
  }));
  note("schedules: "+sched.length+" event(s)");
  const startedNow=sched.filter(x=>x.d<=now+15*6e4&&x.d>now-3.5*36e5);
  for(const x of startedNow){
    if(ms.some(m=>m.id===String(x.ev.id)&&m.state!=="pre"))continue;
    const s=await viaSummary(x.lg,String(x.ev.id));
    if(s){ms=ms.filter(m=>m.id!==s.id);ms.push(s);note("summary "+s.home.code+"-"+s.away.code+" "+s.state+" "+s.clock);}
    else{const m=normalize(x.ev,x.lname);if(m){m.lg=x.lg;ms=ms.filter(y=>y.id!==m.id);ms.push(m);note("schedule "+m.home.code+"-"+m.away.code+" "+m.state);}}
  }
  const live=ms.find(m=>m.state==="in"||m.state==="ht");
  const recent=ms.filter(m=>m.state==="post"&&now-m.kickoff<4*36e5).sort((a,b)=>b.kickoff-a.kickoff)[0];
  const soon=ms.filter(m=>m.state==="pre"&&m.kickoff>now-36e5).sort((a,b)=>a.kickoff-b.kickoff)[0];
  let pick=live||(soon&&soon.kickoff-now<3*36e5?soon:null)||recent||soon;
  if(!pick){
    const next=sched.filter(x=>x.d>now).sort((a,b)=>a.d-b.d)[0];
    if(next){pick=Object.assign(normalize(next.ev,next.lname),{lg:next.lg});}
  }
  if(pick&&(pick.state!=="pre"||pick.kickoff-now<3*36e5))locked={lg:pick.lg,id:pick.id,kick:+pick.kickoff};else locked=null;
  if(pick)note("showing "+pick.home.code+"-"+pick.away.code+" "+pick.state+" "+(pick.clock||"")+" ["+pick.lg+"]");
  return pick;
}

let failures=0;
async function poll(){
  let delay=300000;
  try{
    const m=DEMO?demoNext():await findMatch();
    failures=0;ingest(m);
    if(m){
      const toKick=m.kickoff-Date.now();
      delay=m.state==="in"||m.state==="ht"?15000:(m.state==="pre"&&toKick<36e5)?30000:m.state==="post"?120000:300000;
      if(DEMO)delay=demoDelay;
    }
  }catch(e){failures++;log("feed error: "+e.message);delay=Math.min(120000,15000*failures);}
  setTimeout(poll,delay);
}

/* ================= demo: a scripted Clásico played through the same pipeline ================= */
const demoDelay=2500;let demoStep=0;
const demoScript=[
  {s:"pre"},{s:"in",c:"1'"},{s:"in",c:"9'"},
  {s:"in",c:"23'",g:["h","Kylian Mbappé","23'"]},{s:"in",c:"31'",y:["a","Pedri","31'"]},
  {s:"in",c:"41'",g:["a","Robert Lewandowski","41'"]},{s:"in",c:"45'+2'"},
  {s:"ht"},{s:"ht"},{s:"in",c:"46'"},
  {s:"in",c:"58'",g:["h","Vinícius Júnior","58'"]},{s:"in",c:"67'"},
  {s:"in",c:"74'",r:["a","Gavi","74'"]},{s:"in",c:"82'"},
  {s:"in",c:"90'+3'",g:["h","Jude Bellingham","90'+3'"]},{s:"in",c:"90'+5'"},
  {s:"post"},{s:"post"},{s:"post"},{s:"post"}
];
const demoEvents=[];
let demoRound=0;
function demoNext(){
  if(demoStep>=demoScript.length){demoStep=0;demoEvents.length=0;demoRound++;}
  const st=demoScript[demoStep];demoStep++;
  if(st.g&&!demoEvents.some(e=>e.key==="g"+st.g[2]))demoEvents.push({type:"goal",side:st.g[0],player:st.g[1],clockText:st.g[2],minute:minuteOf(st.g[2]),key:"g"+st.g[2]});
  if(st.y&&!demoEvents.some(e=>e.key==="y"+st.y[2]))demoEvents.push({type:"yellow",side:st.y[0],player:st.y[1],clockText:st.y[2],minute:minuteOf(st.y[2]),key:"y"+st.y[2]});
  if(st.r&&!demoEvents.some(e=>e.key==="r"+st.r[2]))demoEvents.push({type:"red",side:st.r[0],player:st.r[1],clockText:st.r[2],minute:minuteOf(st.r[2]),key:"r"+st.r[2]});
  const hs=demoEvents.filter(e=>e.type==="goal"&&e.side==="h").length,as=demoEvents.filter(e=>e.type==="goal"&&e.side==="a").length;
  return {id:"demo"+demoRound,comp:"LaLiga",venue:"Santiago Bernabéu",state:st.s,clock:st.s==="post"?"FT":st.c||"",minute:st.s==="post"?90:st.s==="ht"?45:minuteOf(st.c),
    kickoff:new Date(Date.now()+(st.s==="pre"?36e5:0)),
    home:{id:"86",code:"RMA",name:"Real Madrid",logo:"https://a.espncdn.com/i/teamlogos/soccer/500/86.png",score:hs},
    away:{id:"83",code:"BAR",name:"Barcelona",logo:"https://a.espncdn.com/i/teamlogos/soccer/500/83.png",score:as},
    events:demoEvents.slice()};
}

poll();
})();
